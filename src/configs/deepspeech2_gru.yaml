defaults:
  - model: deepspeech2
  - writer: cometml
  - metrics: example
  - datasets: deepspeech2
  - dataloader: example
  - transforms: deepspeech2_gru
  - _self_
data_dir: data/datasets/librispeech
optimizer:
  _target_: torch.optim.AdamW
  lr: 3e-4
  weight_decay: 1e-4
lr_scheduler:
  _target_: torch.optim.lr_scheduler.ConstantLR
  factor: 1.0
  total_iters: 100000
loss_function:
  _target_: src.loss.CTCLossWrapper
  blank: 0
text_encoder:
  _target_: src.text_encoder.ArgmaxCTCTextEncoder
writer:
  project_name: asr
  run_name: deepspeech2_gru_lr3e-4_clip5
dataloader:
  batch_size: 4
  num_workers: 2
  persistent_workers: true
trainer:
  log_step: 50
  n_epochs: 100
  epoch_len: 1000
  device_tensors: ["spectrogram", "text_encoded"]
  resume_from: null
  device: cuda
  override: false
  monitor: "min val_WER_(Argmax)"
  save_period: 1
  early_stop: ${trainer.n_epochs}
  save_dir: saved
  seed: 1
  max_grad_norm: 5.0
  skip_oom: false
